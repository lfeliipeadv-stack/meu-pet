name: Wiki

# Publica o conteudo da pasta wiki/ no Wiki do repositório (https://github.com/lfeliipeadv-stack/meu-pet/wiki).
# A pasta wiki/ é a fonte da verdade: editar lá e enviar para o master atualiza o Wiki.
on:
  push:
    branches: [master]
    paths: ['wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:
  # O repositorio do Wiki so nasce quando a primeira pagina e criada pela
  # interface do GitHub. A rotina de hora em hora publica assim que isso
  # acontecer, sem precisar de um novo envio.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar no Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          WIKI_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.wiki.git"
          rm -rf .wiki

          # O repositório do Wiki só passa a existir depois da primeira página.
          # Quando ainda não existe, o clone falha e o push inicial é o que o cria.
          if git clone --depth 1 "$WIKI_URL" .wiki 2>/dev/null; then
            echo "Wiki ja existia."
          else
            rm -rf .wiki
            mkdir -p .wiki
            cd .wiki
            git init -q
            git remote add origin "$WIKI_URL"
            git checkout -q -b master
            echo "Wiki criado do zero."
          fi

          # A identidade precisa estar no repositorio do Wiki, nao no checkout.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Limpa as páginas antigas e copia as de wiki/.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../wiki/. ./

          git add -A
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
          else
            git commit -q -m "Wiki: atualiza as paginas do repositorio"
            # O primeiro push cria o repositorio do Wiki. A interface do GitHub
            # e a unica forma de inicializa-lo, entao um erro aqui significa
            # que a primeira pagina ainda nao foi criada.
            if git push origin master 2>&1 | tee /tmp/push.log; then
              echo "Wiki publicado."
            else
              echo "::warning::O repositorio do Wiki ainda nao existe. Crie a primeira"
              echo "::warning::pagina em https://github.com/${REPO}/wiki/_new e a proxima"
              echo "::warning::rodalia publica o manual inteiro automaticamente."
              exit 0
            fi
          fi
