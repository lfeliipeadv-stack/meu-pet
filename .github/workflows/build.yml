name: Build e autoteste

# A cada envio para o master (e em pull requests): compila o DesktopPet e roda o autoteste
# (DesktopPet.exe --selftest), que verifica lembretes, Pomodoro, pet virtual, traduções, backup,
# balões, menu do pet, agenda e a integração com o Claude Code com o pet de verdade na tela.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compilar
        run: dotnet build src/DesktopPet.Net.csproj -c Release --nologo

      - name: Autoteste
        shell: pwsh
        run: |
          $exe = Resolve-Path "src/bin/Release/net10.0-windows/win-x64/DesktopPet.exe"
          $result = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process $exe -ArgumentList "--selftest=$result" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "O autoteste não terminou em 5 minutos" }
          if (Test-Path $result) { Get-Content $result } else { throw "O autoteste não gerou resultado" }
          if ($p.ExitCode -ne 0) { throw "$($p.ExitCode) verificação(ões) falharam" }

      - name: Testes de movimento (.NET 10)
        shell: pwsh
        run: ./tests/run-net-motion-tests.ps1 -Scales 1,3 -OutputDirectory (Join-Path $env:RUNNER_TEMP "motion-tests")

      - name: Guardar o resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoteste
          path: ${{ runner.temp }}/selftest.txt
          if-no-files-found: ignore
